<!DOCTYPE html>

<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glass {
            backdrop-filter: blur(24px);
            background-color: rgba(243, 251, 255, 0.7);
        }
        .digital-curator-gradient {
            background: linear-gradient(135deg, #154212 0%, #2D5A27 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col relative overflow-hidden">
<!-- Suppressed Navigation Shell as per Transactional/Login Rule -->
<!-- Background Decorative Elements -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-96 h-96 rounded-full bg-primary-fixed/20 blur-[100px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 rounded-full bg-secondary-container/30 blur-[80px]"></div>
<img class="absolute top-0 right-0 w-full h-full object-cover opacity-5 mix-blend-multiply" data-alt="abstract close-up of delicate tropical leaf veins with soft sunlight filtering through green foliage creating organic patterns" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBP5PMbJp9EePriq7BkcXUBxJ0R-zArHJPQ8noB5rxAxVqLDoGYlkg8JwcSCDj07tla_SEYtTbON7jSj6EQHqz2W3Qlia8BvCcZltULHMd-9OnNVN5lg7ff08FCW6eQ3pBlFrg57INp2VV2vPCLlg0eGK8S3FJeuJu44M9bBv3A1Fssyz9h3CCsIyXc4iPSj-aTjtE_PCVd7zSanPgDCcyfx_7b93mFqETVrUmt8MzQ6pPJRiagnwnFJLoAS9gf_K-7IQOXPmTUTerG"/>
</div>
<main class="flex-grow flex items-center justify-center px-6 relative z-10 py-12">
<div class="w-full max-w-md">
<!-- Branding Section -->
<header class="text-center mb-12">
<div class="inline-flex items-center justify-center p-4 mb-6 rounded-xl bg-surface-container-lowest shadow-[0px_12px_32px_rgba(21,29,32,0.06)]">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="eco">eco</span>
</div>
<h1 class="text-3xl font-black tracking-tighter text-primary mb-2">Zar3aTech</h1>
<p class="text-headline-md font-headline font-bold text-on-surface-variant tracking-tight">Bon retour, Conservateur</p>
</header>
<!-- Login Form Section -->
<div class="bg-glass p-8 md:p-10 rounded-lg shadow-[0px_12px_32px_rgba(21,29,32,0.06)] border border-outline-variant/10">
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-widest text-on-surface-variant ml-2 font-label">Adresse email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline/50 font-body" placeholder="nom@exemple.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-2">
<label class="block text-xs font-semibold uppercase tracking-widest text-on-surface-variant font-label">Mot de passe</label>
<a class="text-xs font-bold text-primary hover:text-primary-container transition-colors font-label" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline/50 font-body" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center">
<button class="text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 digital-curator-gradient text-white font-headline font-bold text-lg rounded-full shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-8" type="submit">
                        Se connecter
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Switch Action -->
<div class="mt-10 pt-8 text-center relative">
<!-- Ghost Border Replacement -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-16 h-[2px] bg-outline-variant/20 rounded-full"></div>
<p class="text-on-surface-variant text-sm font-body">
                        Pas encore de compte ? 
                        <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-2 decoration-primary-fixed" href="#">S'inscrire</a>
</p>
</div>
</div>
<!-- Language/Support Footer -->
<footer class="mt-8 flex justify-center items-center gap-6 text-xs font-semibold text-outline tracking-wider font-label uppercase">
<a class="hover:text-primary transition-colors" href="#">Aide</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-primary transition-colors" href="#">Confidentialité</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<div class="flex items-center gap-1 cursor-pointer hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm">language</span>
                    Français (FR)
                </div>
</footer>
</div>
</main>
<!-- Contextual Asymmetric Graphic Element -->
<div class="fixed bottom-[-5rem] right-[-5rem] w-64 h-64 lg:w-96 lg:h-96 opacity-20 pointer-events-none">
<img class="w-full h-full object-contain rotate-12" data-alt="isolated macro photograph of a vibrant green monstera leaf with intricate natural perforations and textured surface details" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAoILUdFStokJL-ExVNV_F3LkSqQeNbqy31N1NyEOPNIEQzA0RlAi4G7DcB9JTjWV24kZWNxfphXFZF5_Ia78rD9-Lt7uIYSrR3JCHFlKeZsU9Qno-JCeCN0FCKNrrLC-KOcQ_1FXhiFQ-CDBPmMoUrHSTJKQOaAf1VHLA-ZU3vGZPbziGXbGgDE7Uw1ugewk6BxklK9fqT8H8NN8Yr0kwU2NsN-LsPxQT84hxLps9vIDCG94_PgeoA_Hm6VSb9KxQ9Iymfb5DHsE1Q"/>
</div>
</body></html>
